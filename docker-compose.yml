name: geoblacklight

services:
  mysql:
    image: mysql:9.7.1
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  solr:
    image: solr:9.2.1
    restart: unless-stopped
    command: ["solr-precreate", "blacklight-core", "/opt/solr-conf"]
    volumes:
      - solr_data:/var/solr
      - ./solr/conf:/opt/solr-conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      MYSQL_SERVER: mysql
      MYSQL_PORT: 3306
      SOLR_URL: http://solr:8983/solr/blacklight-core
      PORT: 3000
      PIDFILE: /tmp/server.pid
    depends_on:
      mysql:
        condition: service_healthy
      solr:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mysql_data:
  solr_data:
  caddy_data:
  caddy_config: